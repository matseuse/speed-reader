<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pace — a speed reader</title>
<style>
  :root{
    --bg: #14141a;
    --bg-raised: #1c1c24;
    --ink: #edeced;
    --ink-dim: #8b8b96;
    --rule: #2c2c36;
    --pivot: #c1443c;
    --progress: #d9a441;
    --focus-ring: #6f7bff;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  .app{
    width:100%;
    max-width: 720px;
  }
  header{
    text-align:center;
    margin-bottom: 28px;
  }
  header h1{
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
    color: var(--ink);
  }
  header p{
    margin:0;
    font-size: 13px;
    color: var(--ink-dim);
  }

  /* --- Reader stage --- */
  .stage{
    position: relative;
    background: var(--bg-raised);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 56px 24px 40px;
    margin-bottom: 18px;
  }
  .guide{
    position:absolute;
    top: 18px;
    left: 50%;
    width: 1px;
    height: 14px;
    background: var(--rule);
  }
  .guide.bottom{ top:auto; bottom: 96px; }
  .word-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    min-height: 64px;
    font-family: "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    font-size: 40px;
    font-weight: 500;
    letter-spacing: 0.01em;
    white-space: pre;
    user-select: none;
  }
  .word-row .pre{ color: var(--ink); text-align:right; }
  .word-row .pivot{ color: var(--pivot); }
  .word-row .post{ color: var(--ink); text-align:left; }

  .placeholder{
    text-align:center;
    color: var(--ink-dim);
    font-size: 14px;
    margin-top: 4px;
  }

  .progress-track{
    position:relative;
    height: 3px;
    background: var(--rule);
    border-radius: 2px;
    margin: 28px 4px 0;
    cursor: pointer;
  }
  .progress-fill{
    position:absolute;
    top:0; left:0; height:100%;
    background: var(--progress);
    border-radius: 2px;
    width:0%;
  }
  .progress-meta{
    display:flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }

  /* --- Controls --- */
  .controls{
    display:flex;
    align-items:center;
    gap: 12px;
    margin-bottom: 18px;
  }
  button{
    font-family: inherit;
    border: 1px solid var(--rule);
    background: var(--bg-raised);
    color: var(--ink);
    border-radius: 5px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 120ms ease, background 120ms ease;
  }
  button:hover{ border-color: #43434f; }
  button:focus-visible, input:focus-visible{
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }
  button.primary{
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
    min-width: 92px;
    font-weight: 600;
  }
  button.primary:hover{ background: #d8d8d6; }
  button.icon{ padding: 9px 12px; }

  .spacer{ flex:1; }

  .speed-control{
    display:flex;
    align-items:center;
    gap:10px;
    font-size: 12px;
    color: var(--ink-dim);
  }
  .speed-control input[type=range]{
    width: 130px;
    accent-color: var(--progress);
  }
  .speed-value{
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    min-width: 56px;
  }

  /* --- Input panel --- */
  details.input-panel{
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: var(--bg-raised);
  }
  details.input-panel summary{
    list-style:none;
    cursor:pointer;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--ink-dim);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  details.input-panel summary::-webkit-details-marker{ display:none; }
  summary .chev{ transition: transform 120ms ease; color: var(--ink-dim); }
  details[open] summary .chev{ transform: rotate(90deg); }
  .panel-body{
    padding: 0 16px 16px;
  }
  textarea{
    width:100%;
    min-height: 120px;
    resize: vertical;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 5px;
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    line-height: 1.5;
    padding: 10px 12px;
  }
  .panel-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .field{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 12px;
    color: var(--ink-dim);
  }
  select{
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 5px 8px;
    font-family: inherit;
    font-size: 12px;
  }
  .load-btn{ margin-left: auto; }

  .hint{
    text-align:center;
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 14px;
  }
  kbd{
    background: var(--bg-raised);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: inherit;
    font-size: 10.5px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Pace</h1>
    <p>Paste text, set a pace, read one word at a time.</p>
  </header>

  <div class="stage">
    <div class="guide"></div>
    <div class="guide bottom"></div>
    <div class="word-row" id="wordRow">
      <span class="pre" id="wordPre"></span><span class="pivot" id="wordPivot"></span><span class="post" id="wordPost"></span>
    </div>
    <div class="placeholder" id="placeholder">Load some text below to begin</div>

    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-meta">
      <span id="wordCount">0 / 0 words</span>
      <span id="timeLeft">—</span>
    </div>
  </div>

  <div class="controls">
    <button class="icon" id="backBtn" title="Back 10 words">⟲ 10</button>
    <button class="primary" id="playBtn">Start</button>
    <button class="icon" id="restartBtn" title="Restart">⟲</button>
    <div class="spacer"></div>
    <div class="speed-control">
      <span>Speed</span>
      <input type="range" id="wpmSlider" min="100" max="900" step="10" value="300">
      <span class="speed-value" id="wpmValue">300 wpm</span>
    </div>
  </div>

  <details class="input-panel" open id="inputPanel">
    <summary>Text <span class="chev">›</span></summary>
    <div class="panel-body">
      <textarea id="textInput" placeholder="Paste or type the text you want to read here…"></textarea>
      <div class="panel-row">
        <label class="field">
          Chunk size
          <select id="chunkSize">
            <option value="1">1 word</option>
            <option value="2">2 words</option>
            <option value="3">3 words</option>
          </select>
        </label>
        <button class="load-btn primary" id="loadBtn">Load text</button>
      </div>
    </div>
  </details>

  <div class="hint">
    <kbd>Space</kbd> play / pause · <kbd>←</kbd> <kbd>→</kbd> step a word · <kbd>↑</kbd> <kbd>↓</kbd> adjust speed
  </div>
</div>

<script>
(function(){
  const textInput = document.getElementById('textInput');
  const loadBtn = document.getElementById('loadBtn');
  const inputPanel = document.getElementById('inputPanel');
  const chunkSizeSel = document.getElementById('chunkSize');

  const wordPre = document.getElementById('wordPre');
  const wordPivot = document.getElementById('wordPivot');
  const wordPost = document.getElementById('wordPost');
  const placeholder = document.getElementById('placeholder');

  const playBtn = document.getElementById('playBtn');
  const backBtn = document.getElementById('backBtn');
  const restartBtn = document.getElementById('restartBtn');

  const wpmSlider = document.getElementById('wpmSlider');
  const wpmValue = document.getElementById('wpmValue');

  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const wordCountEl = document.getElementById('wordCount');
  const timeLeftEl = document.getElementById('timeLeft');

  let tokens = [];      // chunks to display
  let rawWords = [];    // individual words, for time estimate
  let index = 0;
  let playing = false;
  let timer = null;
  let wpm = 300;

  function splitIntoChunks(text, chunkSize){
    const words = text.split(/\s+/).filter(Boolean);
    const chunks = [];
    for(let i=0; i<words.length; i += chunkSize){
      chunks.push(words.slice(i, i+chunkSize).join(' '));
    }
    return { chunks, words };
  }

  // Optimal recognition point: roughly a third into the word,
  // biased slightly left for longer words.
  function pivotIndex(word){
    const len = word.length;
    if(len <= 1) return 0;
    if(len <= 5) return 1;
    if(len <= 9) return Math.ceil(len * 0.3);
    return Math.ceil(len * 0.35);
  }

  function render(){
    if(tokens.length === 0){
      wordPre.textContent = '';
      wordPivot.textContent = '';
      wordPost.textContent = '';
      placeholder.style.display = 'block';
      progressFill.style.width = '0%';
      wordCountEl.textContent = '0 / 0 words';
      timeLeftEl.textContent = '—';
      return;
    }
    placeholder.style.display = 'none';
    const chunk = tokens[index] || '';
    const pIdx = pivotIndex(chunk);
    wordPre.textContent = chunk.slice(0, pIdx);
    wordPivot.textContent = chunk.slice(pIdx, pIdx+1) || '';
    wordPost.textContent = chunk.slice(pIdx+1);

    const pct = tokens.length ? (index / (tokens.length - 1 || 1)) * 100 : 0;
    progressFill.style.width = pct + '%';
    wordCountEl.textContent = (index+1) + ' / ' + tokens.length;

    const wordsRemaining = rawWords.length - Math.round((index/tokens.length) * rawWords.length);
    const secondsLeft = Math.max(0, Math.round((wordsRemaining / wpm) * 60));
    const m = Math.floor(secondsLeft / 60);
    const s = secondsLeft % 60;
    timeLeftEl.textContent = m + ':' + String(s).padStart(2,'0') + ' left';
  }

  function loadText(){
    const text = textInput.value.trim();
    const chunkSize = parseInt(chunkSizeSel.value, 10);
    const result = splitIntoChunks(text, chunkSize);
    tokens = result.chunks;
    rawWords = result.words;
    index = 0;
    pause();
    render();
    if(tokens.length){
      inputPanel.removeAttribute('open');
    }
  }

  function tick(){
    if(index >= tokens.length - 1){
      pause();
      render();
      return;
    }
    index++;
    render();
  }

  function intervalMs(){
    const chunkSize = parseInt(chunkSizeSel.value, 10);
    return (60000 / wpm) * chunkSize;
  }

  function play(){
    if(tokens.length === 0) return;
    if(index >= tokens.length - 1) index = 0;
    playing = true;
    playBtn.textContent = 'Pause';
    clearInterval(timer);
    timer = setInterval(tick, intervalMs());
  }

  function pause(){
    playing = false;
    playBtn.textContent = 'Start';
    clearInterval(timer);
  }

  function togglePlay(){
    if(playing) pause(); else play();
  }

  function step(delta){
    if(tokens.length === 0) return;
    pause();
    index = Math.min(tokens.length - 1, Math.max(0, index + delta));
    render();
  }

  function restart(){
    pause();
    index = 0;
    render();
  }

  function setWpm(v){
    wpm = Math.min(900, Math.max(100, v));
    wpmSlider.value = wpm;
    wpmValue.textContent = wpm + ' wpm';
    if(playing){
      clearInterval(timer);
      timer = setInterval(tick, intervalMs());
    }
  }

  loadBtn.addEventListener('click', loadText);
  playBtn.addEventListener('click', togglePlay);
  backBtn.addEventListener('click', () => step(-10));
  restartBtn.addEventListener('click', restart);

  wpmSlider.addEventListener('input', (e) => setWpm(parseInt(e.target.value, 10)));

  progressTrack.addEventListener('click', (e) => {
    if(tokens.length === 0) return;
    const rect = progressTrack.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    pause();
    index = Math.round(ratio * (tokens.length - 1));
    render();
  });

  document.addEventListener('keydown', (e) => {
    if(document.activeElement === textInput) return;
    if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    else if(e.code === 'ArrowRight'){ e.preventDefault(); step(1); }
    else if(e.code === 'ArrowLeft'){ e.preventDefault(); step(-1); }
    else if(e.code === 'ArrowUp'){ e.preventDefault(); setWpm(wpm + 25); }
    else if(e.code === 'ArrowDown'){ e.preventDefault(); setWpm(wpm - 25); }
  });

  // Seed with a short sample so the app isn't empty on first open.
  textInput.value = "Paste any article, chapter, or block of text into this box, then press Load text to start reading it one word at a time. Adjust the speed slider to find a pace that feels fast but still comfortable, and use the space bar to pause whenever you need to think something over.";
  setWpm(300);
  render();
})();
</script>

</body>
</html>
